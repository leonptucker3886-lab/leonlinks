const $=id=>document.getElementById(id);
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
let st,VIEW=false;
try{if(window.__LL){st=window.__LL;VIEW=true}else if(location.hash.length>2){st=dec(location.hash.slice(1));VIEW=true}}catch(e){}
if(!st){try{st=JSON.parse(localStorage.getItem('leonlink'))}catch(e){}}
if(!st||!st.links)st=JSON.parse(JSON.stringify(DEF));
if(VIEW)document.body.classList.add('view');
const save=()=>{if(!VIEW)localStorage.setItem('leonlink',JSON.stringify(st))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{u=String(u||'').trim();if(/^(https?:|mailto:|tel:)/i.test(u))return u;if(/^[\w.-]+\.[a-z]{2,}/i.test(u))return 'https://'+u;return '#'};
function applyTheme(){const t=THEMES[st.theme]||THEMES.norse,r=document.documentElement.style;
['bg','glow','surface','line','text','muted','accent','btn','btnH','r','head','body','hw','track','case'].forEach(k=>r.setProperty('--'+k,t[k]));
$('pattern').innerHTML=P[t.pat]||'';document.querySelector('meta[name=theme-color]').content=t.bg}
const RUNE='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ',BIN='01<>/#{}[]';
function scramble(el){const t=THEMES[st.theme];if(!t.fx||el._b)return;const set=t.fx==='runes'?RUNE:BIN,orig=el.dataset.t;el._b=1;let f=0;
const iv=setInterval(()=>{el.textContent=[...orig].map((c,i)=>i<f/2||c===' '?c:set[Math.random()*set.length|0]).join('');if(++f>orig.length*2){clearInterval(iv);el.textContent=orig;el._b=0}},22)}
function render(){applyTheme();document.title=(st.name||'Leonlink')+' — Links';
$('avatar').innerHTML=st.avatar?`<img src="${esc(/^data:image\//.test(st.avatar)?st.avatar:safe(st.avatar))}" alt="">`:esc(st.initials||(st.name||'L').split(' ').map(w=>w[0]).join('').slice(0,2));
$('name').textContent=st.name;$('title').textContent=st.title;$('bio').textContent=st.bio;
const clicks=JSON.parse(localStorage.getItem('ll_clicks')||'{}');
$('links').innerHTML=st.links.filter(l=>l.t).map((l,i)=>`<a class="link${l.f?' feat':''}" href="${esc(safe(l.u))}" target="_blank" rel="noopener" style="animation-delay:${.15+i*.06}s" data-i="${i}"><span class="ic">${IC[l.i]||IC.link}</span><span class="lt"><span class="tx" data-t="${esc(l.t)}">${esc(l.t)}</span>${l.s?`<small>${esc(l.s)}</small>`:''}</span>${!VIEW&&clicks[l.u]?`<small style="color:var(--muted);font-size:11px">${clicks[l.u]}</small>`:''}<span class="arr">${UI.arr}</span></a>`).join('');
$('links').querySelectorAll('.link').forEach(a=>{a.addEventListener('mouseenter',()=>scramble(a.querySelector('.tx')));a.addEventListener('click',()=>{const c=JSON.parse(localStorage.getItem('ll_clicks')||'{}'),u=st.links[a.dataset.i].u;c[u]=(c[u]||0)+1;localStorage.setItem('ll_clicks',JSON.stringify(c))})});
$('vc').innerHTML=UI.user+'Save contact';$('vc').style.display=(st.email||st.phone)?'':'none'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('vc').onclick=()=>{const v=['BEGIN:VCARD','VERSION:3.0','FN:'+st.name,'TITLE:'+st.title,st.email&&'EMAIL:'+st.email,st.phone&&'TEL:'+st.phone,'URL:'+(st.links.find(l=>/^https?:/.test(l.u))||{}).u,'NOTE:'+st.bio,'END:VCARD'].filter(Boolean).join('\r\n');dl((st.name||'contact').replace(/\s+/g,'_')+'.vcf',v,'text/vcard')};
function open(id){document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('open',s.id===id));$('scrim').classList.add('on')}
function close(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));$('scrim').classList.remove('on')}
$('scrim').onclick=close;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);addEventListener('keydown',e=>e.key==='Escape'&&close());
function buildGrid(){$('grid').innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="th${k===st.theme?' on':''}" data-k="${k}"><div class="pv" style="background:radial-gradient(80% 90% at 50% 0%,${t.glow},transparent),${t.bg};color:${t.text}"><b style="font-family:${t.head};text-transform:${t.case};letter-spacing:${t.track};font-weight:${t.hw}">Aa</b><i style="background:${t.btn};border:1px solid ${t.line};border-radius:${Math.min(parseInt(t.r),5)}px"></i><i style="width:60%;background:${t.accent};opacity:.85"></i></div><span>${t.n}<em>${t.d}</em></span></button>`).join('');
$('grid').querySelectorAll('.th').forEach(b=>b.onclick=()=>{st.theme=b.dataset.k;save();render();buildGrid()})}
const iconOpts=k=>Object.keys(IC).map(i=>`<option ${i===k?'selected':''}>${i}</option>`).join('');
function buildForm(){const f=$('form');f.innerHTML=`<label>Name</label><input data-f="name" value="${esc(st.name)}"><label>Title</label><input data-f="title" value="${esc(st.title)}"><label>Bio</label><textarea data-f="bio">${esc(st.bio)}</textarea><label>Initials (shown if no photo)</label><input data-f="initials" value="${esc(st.initials)}" maxlength="3"><label>Photo / logo URL — or upload</label><input data-f="avatar" value="${esc(/^data:/.test(st.avatar)?'(uploaded image)':st.avatar)}"><input type="file" id="up" accept="image/*" style="margin-top:6px"><label>Email (for Save contact)</label><input data-f="email" value="${esc(st.email)}"><label>Phone</label><input data-f="phone" value="${esc(st.phone)}">
<label style="margin-top:26px;font-size:13px;color:#e4e4e7">Links</label><div id="rows"></div><button class="primary" id="add">+ Add link</button>`;
f.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{if(el.dataset.f==='avatar'&&el.value==='(uploaded image)')return;st[el.dataset.f]=el.value;save();render()});
$('up').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(img.width,img.height),x=c.getContext('2d');x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,240,240);st.avatar=c.toDataURL('image/jpeg',.82);save();render();buildForm()};img.src=r.result};r.readAsDataURL(file)};
$('add').onclick=()=>{st.links.push({t:'New link',s:'',u:'https://',i:'link'});save();render();rows()};rows()}
function rows(){$('rows').innerHTML=st.links.map((l,i)=>`<div class="row" data-i="${i}"><input class="full" data-k="t" value="${esc(l.t)}" placeholder="Title"><input data-k="s" value="${esc(l.s)}" placeholder="Subtitle"><select data-k="i">${iconOpts(l.i)}</select><input class="full" data-k="u" value="${esc(l.u)}" placeholder="https://"><div class="ctl"><label><input type="checkbox" data-k="f" ${l.f?'checked':''}>Featured</label><button class="mini" data-m="-1">↑</button><button class="mini" data-m="1">↓</button><button class="mini" data-d>Remove</button></div></div>`).join('');
$('rows').querySelectorAll('.row').forEach(r=>{const i=+r.dataset.i;r.querySelectorAll('[data-k]').forEach(el=>el.oninput=el.onchange=()=>{st.links[i][el.dataset.k]=el.type==='checkbox'?(el.checked?1:0):el.value;save();render()});
r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const j=i+ +b.dataset.m;if(j<0||j>=st.links.length)return;[st.links[i],st.links[j]]=[st.links[j],st.links[i]];save();render();rows()});
r.querySelector('[data-d]').onclick=()=>{st.links.splice(i,1);save();render();rows()}})}
$('dock').innerHTML=`<button id="bT">${UI.pal}<span>Themes</span></button><button id="bE">${UI.pen}<span>Edit</span></button><button id="bS">${UI.share}<span>Share</span></button><button id="bX">${UI.dl}<span>Export</span></button>`;
$('bT').onclick=()=>{buildGrid();open('themes')};$('bE').onclick=()=>{buildForm();open('edit')};
$('bS').onclick=async()=>{const u=location.origin+location.pathname+'#'+enc(st);try{await navigator.clipboard.writeText(u);toast('Share link copied')}catch(e){prompt('Copy your link',u)}};
$('bX').onclick=()=>{const h='<!DOCTYPE html>'+document.documentElement.outerHTML.replace('<script>','<script>window.__LL='+JSON.stringify(st).replace(/</g,'\\u003c')+';');dl('index.html',h,'text/html');toast('Page exported — upload index.html to any host')};
render();
</script></body></html>
