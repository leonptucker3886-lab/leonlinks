<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Stats Lite · Linkline</title><meta name="description" content="Tap Stats Lite: see which Linkline links get tapped most. Private, stored in your browser only.">
<meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#0f1115;color:#eee;max-width:720px;margin:0 auto;padding:24px}
.beta{background:#f5b301;color:#000;padding:8px 12px;border-radius:8px;font-weight:600;margin-bottom:16px}
h1{margin:.2em 0}.card{background:#1a1d24;border-radius:12px;padding:16px;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #2a2e38;text-align:left}
.bar{height:8px;background:#4f8cff;border-radius:4px}button{background:#4f8cff;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin-right:8px;cursor:pointer}
.muted{color:#999;font-size:.9em}a{color:#8fb4ff}</style></head><body>
<div class="beta">BETA — testing build. Stats are stored only in this browser.</div>
<h1>Tap Stats Lite</h1><p class="muted">Counts every tap on your Linkline links from this device. No server, no tracking cookies.</p>
<div><button id="csv">Export CSV</button><button id="reset">Reset stats</button></div>
<div id="out"></div>
<script>
var KEY='ll_tapstats_v1';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){var d=load(),o=document.getElementById('out'),ks=Object.keys(d);
if(!ks.length){o.innerHTML='<div class="card">No taps yet. Open your Linkline page and tap a link, then come back.</div>';return}
o.innerHTML=ks.map(function(p){var L=d[p].links,arr=Object.keys(L).map(function(t){return[t,L[t]]}).sort(function(a,b){return b[1].taps-a[1].taps});
var tot=arr.reduce(function(s,x){return s+x[1].taps},0),max=arr[0]?arr[0][1].taps:1;
return '<div class="card"><h3>'+esc(d[p].name)+'</h3><p class="muted">'+esc(p)+' · '+tot+' total taps</p><table><tr><th>Link</th><th>Taps</th><th></th><th>Last tap</th></tr>'+
arr.map(function(x){return '<tr><td><a href="'+esc(x[1].url)+'" target="_blank" rel="noopener">'+esc(x[0])+'</a></td><td>'+x[1].taps+'</td><td style="width:30%"><div class="bar" style="width:'+Math.round(x[1].taps/max*100)+'%"></div></td><td class="muted">'+new Date(x[1].last).toLocaleString()+'</td></tr>'}).join('')+'</table></div>'}).join('')}
document.getElementById('reset').onclick=function(){if(confirm('Reset all tap stats on this device?')){localStorage.removeItem(KEY);render()}};
document.getElementById('csv').onclick=function(){var d=load(),r=[['page','link','url','taps','last_tap']];Object.keys(d).forEach(function(p){Object.keys(d[p].links).forEach(function(t){var l=d[p].links[t];r.push([p,t,l.url,l.taps,new Date(l.last).toISOString()])})});
var c=r.map(function(x){return x.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='tap-stats.csv';a.click()};
render();
</script></body></html>
